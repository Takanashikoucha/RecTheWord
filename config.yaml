# RecTheWord v2 配置（锚定仓库根）
audio:
  source: alsa            # 采集后端（Linux 单一后端）；显式可填 alsa
  mic_device: null
  sys_device: null
  sample_rate: 16000
  chunk_ms: 32

vad:
  # 分通道参数（mic 真人易噪 / sys TTS 清晰）；base 值为缺省，per-channel 优先
  threshold: 0.5           # 缺省阈值（per-channel 覆盖）
  min_speech_ms: 100       # 弱 onset 快速确认，保句首（3 窗仍滤极短脉冲噪声）
  min_silence_ms: 400      # 卡在句内停顿~300ms 与句间停顿~500ms 之间
  max_speech_ms: 2000      # 短段（fast 2s）→ ASR 解码快 → 端到端延迟低（见 asr.segment_policy）
  merge_gap_ms: 300        # 紧贴碎段合并回一句，但不粘真句子
  pad_strategy: dyn_shared # 动态 pre_pad：双通道共用一个 ASR 延迟 EMA
  live_diarize: false      # 录制时不实时粗分说话人，仅离线 refine_speakers 才区分
  scheme: E                # 分通道参数 + 冷启动修复 + 动态 pre_pad
  pad_dyn_cap_ms: 300      # 动态 pre_pad 补充封顶 300ms（压延迟）
  mic_threshold: 0.5
  sys_threshold: 0.5
  mic_merge_gap_ms: 500
  sys_merge_gap_ms: 500
  mic_pad_base_ms: 350
  sys_pad_base_ms: 300
  skip_short_gap_ms: 300   # 距上一段 <0.3s 合并到上一段（碎片吸收，音频不丢）

asr:
  model: Qwen/Qwen3-ASR-0.6B
  device: cpu
  compute_type: int8
  threads: 8                 # P5：锁定 8 核目标机的物理核数
  segment_policy: fast   # fast(2s)+电平衰减保护：段更短→单段解码更快→延迟更低（有 FORCE-DEFER 防切断字词）
  max_new_tokens: 128

corrector:
  # 本地纠错 + 翻译（Qwen3 0.6B，关闭 thinking）：比双 ASR 实例更有价值的辅助通道
  enabled: true
  model: models/Qwen3-0.6B   # 本地目录（相对仓库根）；避免走 ModelScope 下载卡死
  threads: 4
  context_sentences: 10    # 纠错上下文（含另一通道，最多 10 条）
  local_translate: true    # 无翻译 API 时用本地翻译

api:
  base_url: ""             # OpenAI 兼容网关，如 http://127.0.0.1:1234/v1
  api_key: ""
  model: ""
  translate_timeout_s: 15
  minutes_timeout_s: 120

ui:
  overlay_theme: glass     # glass | solid | outline | light
  font_size: 22           # 下调：28 偏大导致长句折行/显示不全；22 兼顾可读性与完整显示
  show_original: true

backlog:
  # ASR 积压自适应恢复（两级）：ASR 处理跟不上 VAD 产段速度时防止无限堆积
  enabled: true
  high_watermark: 8      # 队列深度超此值 → L1 源头减量（动态抬 VAD 阈值/拉长时间门限，少产段）
  low_watermark: 3       # 回落到此值以下 → 恢复正常灵敏度
  drop_watermark: 12     # L1 后仍超此值 → L2 drop-oldest 兜底（丢最旧段保最新实时段）
  maxsize: 16            # seg_q 硬上限（兜底，绝不撑爆内存）
  recover_grace_s: 2.0   # 维持低压多久才宣告恢复（防抖）
  boost_threshold: 0.62  # L1 减量时的 VAD 阈值（高于默认 0.5 → 更不敏感）
  boost_min_silence_ms: 500  # L1 减量时的最短静音门限（长于默认 → 晚断句）

session:
  dir: ~/.rectheword/sessions
