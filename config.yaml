# RecTheWord v2 配置（锚定仓库根）
audio:
  source: ""              # 缺省=平台自适应（Windows→wasapi / Linux→alsa）；显式可选 wasapi | alsa | replay
  mic_device: null
  sys_device: null
  sample_rate: 16000
  chunk_ms: 32
  # replay 字段仅测试用（source=replay 时生效）
  replay_mic: tests/fixtures/meeting_sim/zh.wav
  replay_sys: tests/fixtures/meeting_sim/en.wav
  replay_speed: 1.0

vad:
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 800      # P5 实测：TTS 音节间隙可达 500ms+，800ms 兼顾真人语速与 TTS
  max_speech_ms: 8000

asr:
  model: Qwen/Qwen3-ASR-0.6B
  device: cpu
  compute_type: int8
  threads: 8                 # P5：锁定 8 核目标机的物理核数
  segment_policy: balanced   # P5 实测：aggressive(1.5s) 对 TTS/长句过度强切；balanced(3s) 更稳
  max_new_tokens: 128

api:
  base_url: ""             # OpenAI 兼容网关，如 http://127.0.0.1:1234/v1
  api_key: ""
  model: ""
  translate_timeout_s: 15
  minutes_timeout_s: 120

ui:
  overlay_theme: glass     # glass | solid | outline | light
  font_size: 28
  show_original: true

backlog:
  # ASR 积压自适应恢复（两级）：ASR 处理跟不上 VAD 产段速度时防止无限堆积
  enabled: true
  high_watermark: 8      # 队列深度超此值 → L1 源头减量（动态抬 VAD 阈值/拉长时间门限，少产段）
  low_watermark: 3       # 回落到此值以下 → 恢复正常灵敏度
  drop_watermark: 12     # L1 后仍超此值 → L2 drop-oldest 兜底（丢最旧段保最新实时段）
  maxsize: 16            # seg_q 硬上限（兜底，绝不撑爆内存）
  recover_grace_s: 2.0   # 维持低压多久才宣告恢复（防抖）
  boost_threshold: 0.62  # L1 减量时的 VAD 阈值（高于默认 0.5 → 更不敏感）
  boost_min_silence_ms: 500  # L1 减量时的最短静音门限（长于默认 → 晚断句）

session:
  dir: ~/.rectheword/sessions
