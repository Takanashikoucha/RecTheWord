[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rectheword"
version = "0.1.0"
description = "Real-time multilingual (zh/en/ja) transcription with speaker separation, live translation, and AI meeting minutes (FFmpeg + FunASR + PySide6)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "funasr>=1.1.0",
    "torch>=2.1",
    "torchaudio>=2.1",
    "soundfile>=0.12",
    "numpy>=1.24",
    "requests>=2.31",
]

[project.scripts]
rectheword = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "rectheword",
    "rectheword.audio",
    "rectheword.asr",
    "rectheword.ai",
    "rectheword.pipeline",
    "rectheword.ui",
]
